# Hermes prompt enhancer stack
#
# OPTION PAR DEFAUT (zero risque) : OmniRoute reste NATIF sur Windows
# (installation existante, config + combos + cles intactes sur le port 20128)
# et le watcher tourne en Docker en pointant dessus via host.docker.internal.
#
# ATTENTION (option alternative) : mettre OmniRoute dans Docker necessite une
# base NEUVE â€” la migration silencieuse du conteneur RESET les bases issues
# d'installations Windows plus anciennes (verifie : combos vides apres boot).
# Pour tenter l'option conteneurisee : decommenter le service omniroute,
# reconfigurer providers/combos dans le dashboard, et remettre l'upstream du
# watcher sur http://omniroute:20128.
#
# Hermes parle toujours a localhost:20128 (OmniRoute), localhost:20500 (enhancer)
# et localhost:3080 (dsh web).
services:
  watcher:
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
    container_name: prompt-enhancer
    ports:
      - "127.0.0.1:20500:20500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WATCHER_UPSTREAM: http://host.docker.internal:20128
      WATCHER_COMBO_MODEL: reprompter
      WATCHER_MIN_WORDS: "4"
      WATCHER_TIMEOUT: "120"
      WATCHER_SHOW_REWRITE: "1"
      WATCHER_CACHE_TTL: "600"
      WATCHER_SKIP_PREFIXES: "<system-reminder>,<system>,<available_skills>,<skill_content>,<System,[IMPORTANT,You are a summarization agent,You are updating a context compaction summary,Create a structured checkpoint summary"
    restart: unless-stopped

  # DeepSeek Harness (dsh) - Web UI containerized; boots with the stack.
  # DSH_HOME monte ./dsh-home (config + sessions du container, gitignore) et
  # le workspace football-predictor est monte dans /workspaces/football-predictor
  # pour que les sessions patchees (cwd Linux) pointent vers un chemin valide.
  dsh:
    build:
      context: .
      dockerfile: docker/dsh/Dockerfile
    container_name: prompt-enhancer-dsh
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - ./dsh-home:/dsh-home
      - C:\Users\rapha\Desktop\apppredpython\football-predictor:/workspaces/football-predictor
    environment:
      DSH_HOME: /dsh-home
      DSH_AGENTS_HOME: /dsh-home/agents
    restart: unless-stopped

  # SearXNG â€” metasearch engine self-heberge (recherche web gratuite sans cle)
  # Hermes y accede via SEARXNG_URL=http://localhost:8888 (web.search_backend: searxng)
  searxng:
    image: searxng/searxng
    container_name: searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    restart: unless-stopped

