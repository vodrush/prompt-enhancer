# Hermes prompt enhancer stack
#
# OmniRoute reste NATIF sur Windows (le container RESET la base SQLite au
# boot : combos/providers perdus). Le watcher y accede via host.docker.internal.
#
# Hermes/dsh natifs continuent sur localhost:20128.
services:
  watcher:
    build:
      context: .
      dockerfile: docker/watcher/Dockerfile
    container_name: prompt-enhancer
    ports:
      - "127.0.0.1:20500:20500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WATCHER_UPSTREAM: http://host.docker.internal:20128
      WATCHER_COMBO_MODEL: reprompter
      WATCHER_MIN_WORDS: "4"
      WATCHER_TIMEOUT: "120"
      WATCHER_SHOW_REWRITE: "1"
      WATCHER_CACHE_TTL: "600"
      WATCHER_SKIP_PREFIXES: "<system-reminder>,<system>,<available_skills>,<skill_content>,<System,[IMPORTANT,You are a summarization agent,You are updating a context compaction summary,Create a structured checkpoint summary,Current runtime context.,You are now acting as a compaction engine"
    restart: unless-stopped

  # SearXNG - metasearch engine self-heberge (recherche web gratuite sans cle)
  searxng:
    image: searxng/searxng
    container_name: searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    restart: unless-stopped
